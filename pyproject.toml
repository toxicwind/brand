[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brand"
version = "0.4.0"
description = "Hyprland background Computer Use MCP bridge"
readme = "PYPI.md"
requires-python = ">=3.10"
authors = [{ name = "wilf" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Desktop Environment :: Window Managers",
]

[project.urls]
Homepage = "https://github.com/toxicwind/brand"
Repository = "https://github.com/toxicwind/brand.git"
Issues = "https://github.com/toxicwind/brand/issues"

[project.scripts]
brand = "brand:main"

[tool.setuptools]
py-modules = ["brand"]
script-files = [
  "mcp/brand-mcp.py",
  "mcp/action_sequence.py",
  "mcp/compat_env.py",
  "mcp/hypr_management.py",
  "mcp/hypr_socket2.py",
  "mcp/image_pipeline.py",
  "mcp/ocr_backend.py",
  "mcp/process_lease.py",
  "mcp/security_audit.py",
  "mcp/security_doctor.py",
  "mcp/security_policy.py",
  "mcp/target_identity.py",
  "mcp/visual_targets.py",
  "scripts/brandctl",
  "scripts/brand-sandbox",
  "scripts/install-codex-cursor-asset",
]
